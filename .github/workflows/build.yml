name: GDExtension Build

on: [push, pull_request]

jobs:
  build:
    name: Compiling on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Setup Windows Compiler (MSVC)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- COMPILATION STEP ---
      # This builds both debug and release targets to match your .gdextension file
      - name: Compile GDExtension Binaries
        run: |
          scons platform=${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'macos' || 'linux' }} target=template_debug
          scons platform=${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'macos' || 'linux' }} target=template_release

      # --- ARTIFACT UPLOAD STEP ---
      # Matches the exact custom path specified in your SConstruct
      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: PlanarReflectorCpp-binaries-${{ matrix.os }}
          path: PlanarReflector-CPP/addons/PlanarReflectorCpp/bin/